# =====================================================================
# Alembic Configuration File (backend/alembic.ini)
# WHAT THIS FILE DOES:
# Tells the `alembic` CLI tool where our migration scripts live (`script_location = alembic`)
# and adds the current directory (`prepend_sys_path = .`) to Python's import path so

# `alembic/env.py` can import `app.config` and `app.models`.
# =====================================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
